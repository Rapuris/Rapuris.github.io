<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" style="background: linear-gradient(135deg, #fdfbf7 0%, #f9f6f1 100%)">
  <defs>
    <linearGradient id="chefHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Decorative background -->
  <circle cx="100" cy="80" r="40" fill="#e8dcc8" opacity="0.3"/>
  <circle cx="700" cy="220" r="50" fill="#d4c4b0" opacity="0.3"/>
  <circle cx="650" cy="70" r="35" fill="#a67c52" opacity="0.2"/>
  
  <!-- Chef's hat -->
  <ellipse cx="400" cy="180" rx="80" ry="15" fill="#e8dcc8"/>
  <rect x="340" y="130" width="120" height="55" fill="url(#chefHat)" rx="5"/>
  <ellipse cx="400" cy="120" rx="90" ry="60" fill="url(#chefHat)"/>
  <ellipse cx="400" cy="118" rx="85" ry="55" fill="#ffffff"/>
  
  <!-- Utensils crossed -->
  <g transform="translate(200, 160)">
    <rect x="-3" y="0" width="6" height="80" fill="#8b7d6b" rx="2" transform="rotate(-30 0 40)"/>
    <rect x="-15" y="-15" width="4" height="18" fill="#8b7d6b" rx="1" transform="rotate(-30 -13 -6)"/>
    <rect x="-10" y="-15" width="4" height="18" fill="#8b7d6b" rx="1" transform="rotate(-30 -8 -6)"/>
    <rect x="-5" y="-15" width="4" height="18" fill="#8b7d6b" rx="1" transform="rotate(-30 -3 -6)"/>
  </g>
  
  <g transform="translate(600, 160)">
    <rect x="-3" y="0" width="6" height="80" fill="#8b7d6b" rx="2" transform="rotate(30 0 40)"/>
    <circle cx="0" cy="-5" r="12" fill="#a89886"/>
    <ellipse cx="0" cy="-5" rx="10" ry="8" fill="#d4c4b0"/>
  </g>
  
  <!-- Stars for emphasis -->
  <text x="280" y="100" font-family="Georgia, serif" font-size="24" fill="#a67c52">★</text>
  <text x="520" y="100" font-family="Georgia, serif" font-size="24" fill="#a67c52">★</text>
  <text x="280" y="260" font-family="Georgia, serif" font-size="20" fill="#a67c52">★</text>
  <text x="520" y="260" font-family="Georgia, serif" font-size="20" fill="#a67c52">★</text>
</svg>