<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="liver-hero-title">
  <title id="liver-hero-title">Dark illustration of chicken liver on a plate with a fork</title>
  <!-- Dark, moody background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  
  <!-- Vignette effect -->
  <rect width="1200" height="600" fill="url(#vignette)"/>
  
  <!-- Plate -->
  <ellipse cx="600" cy="350" rx="280" ry="260" fill="url(#plate)" opacity="0.9"/>
  <ellipse cx="600" cy="350" rx="280" ry="260" fill="none" stroke="#b0b0b0" stroke-width="3"/>
  
  <!-- Chicken liver (abstract dark shape) -->
  <path d="M 550 320 Q 580 300 620 315 Q 650 320 655 350 Q 650 380 620 385 Q 580 390 560 375 Q 540 355 550 320 Z" 
        fill="#5a2e2e" stroke="#3a1e1e" stroke-width="2"/>
  <ellipse cx="580" cy="350" rx="30" ry="25" fill="#4a2020" opacity="0.7"/>
  <path d="M 560 340 Q 570 335 580 340" fill="none" stroke="#3a1515" stroke-width="1.5"/>
  
  <!-- Fork (abstract) -->
  <g transform="translate(750, 280) rotate(15)">
    <rect x="0" y="0" width="8" height="120" fill="#c0c0c0" stroke="#909090" stroke-width="1"/>
    <rect x="-3" y="-5" width="4" height="25" fill="#c0c0c0" stroke="#909090" stroke-width="0.5"/>
    <rect x="3" y="-5" width="4" height="25" fill="#c0c0c0" stroke="#909090" stroke-width="0.5"/>
    <rect x="9" y="-5" width="4" height="25" fill="#c0c0c0" stroke="#909090" stroke-width="0.5"/>
  </g>
  
  <!-- Text overlay -->
  <text x="600" y="120" font-family="Georgia, serif" font-size="72" font-weight="bold" 
        fill="#8b1a1a" text-anchor="middle" opacity="0.9">
    Liver and Let Die
  </text>
  <text x="600" y="160" font-family="Georgia, serif" font-size="24" font-style="italic" 
        fill="#cccccc" text-anchor="middle" opacity="0.8">
    A Culinary Misadventure
  </text>
</svg>
