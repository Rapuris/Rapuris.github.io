<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meal-prep-title">
  <title id="meal-prep-title">Color-coded meal prep containers representing predictability</title>
  <!-- Meal prep containers -->
  <defs>
    <linearGradient id="container" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8d4e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa"/>
  
  <!-- Monday container (red) -->
  <rect x="50" y="80" width="120" height="90" rx="5" fill="url(#container)" 
        stroke="#4a90b8" stroke-width="3"/>
  <rect x="55" y="85" width="110" height="15" fill="#e74c3c" opacity="0.8"/>
  <text x="110" y="97" font-family="Arial" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">MON</text>
  <rect x="65" y="110" width="90" height="50" rx="3" fill="#d4a574" opacity="0.7"/>
  
  <!-- Tuesday container (orange) -->
  <rect x="190" y="80" width="120" height="90" rx="5" fill="url(#container)" 
        stroke="#4a90b8" stroke-width="3"/>
  <rect x="195" y="85" width="110" height="15" fill="#e67e22" opacity="0.8"/>
  <text x="250" y="97" font-family="Arial" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">TUE</text>
  <rect x="205" y="110" width="90" height="50" rx="3" fill="#d4a574" opacity="0.7"/>
  
  <!-- Wednesday container (yellow) -->
  <rect x="330" y="80" width="120" height="90" rx="5" fill="url(#container)" 
        stroke="#4a90b8" stroke-width="3"/>
  <rect x="335" y="85" width="110" height="15" fill="#f39c12" opacity="0.8"/>
  <text x="390" y="97" font-family="Arial" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">WED</text>
  <rect x="345" y="110" width="90" height="50" rx="3" fill="#d4a574" opacity="0.7"/>
  
  <!-- Thursday container (green) -->
  <rect x="120" y="200" width="120" height="90" rx="5" fill="url(#container)" 
        stroke="#4a90b8" stroke-width="3"/>
  <rect x="125" y="205" width="110" height="15" fill="#27ae60" opacity="0.8"/>
  <text x="180" y="217" font-family="Arial" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">THU</text>
  <rect x="135" y="230" width="90" height="50" rx="3" fill="#d4a574" opacity="0.7"/>
  
  <!-- Friday container (blue) -->
  <rect x="260" y="200" width="120" height="90" rx="5" fill="url(#container)" 
        stroke="#4a90b8" stroke-width="3"/>
  <rect x="265" y="205" width="110" height="15" fill="#2980b9" opacity="0.8"/>
  <text x="320" y="217" font-family="Arial" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">FRI</text>
  <rect x="275" y="230" width="90" height="50" rx="3" fill="#d4a574" opacity="0.7"/>
  
  <!-- Text -->
  <text x="300" y="350" font-family="Georgia, serif" font-size="20" font-style="italic" 
        fill="#666" text-anchor="middle">
    Color-Coded Predictability
  </text>
</svg>
